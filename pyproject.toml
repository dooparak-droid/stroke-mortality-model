[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-model"
version = "0.1.0"
description = "Binary classification model for 14-day mortality prediction following stroke"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
train = [
    "matplotlib>=3.9.0",
    "mlflow>=2.16.0",
]
app = [
    "streamlit>=1.40.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "mlflow>=2.16.0",
    "streamlit>=1.40.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]
